name: Validate lily-epitaph

on:
  push:
  pull_request:

jobs:
  example-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: 0.165.0
          extended: false
      - name: Verify standalone browser runtime
        run: |
          test -f static/assets/vendor/marked.min.js
          test -f static/assets/vendor/highlight.min.js
          test -f static/assets/vendor/purify.min.js
          test -f static/sw.js
          grep -q 'DOMPurify.sanitize' assets/js/protected.js
      - name: Build example site
        working-directory: exampleSite
        run: hugo --themesDir ../.. --gc --minify --panicOnWarning
      - name: Verify runtime assets are published
        run: |
          test -f exampleSite/public/assets/vendor/marked.min.js
          test -f exampleSite/public/assets/vendor/highlight.min.js
          test -f exampleSite/public/assets/vendor/purify.min.js
          test -f exampleSite/public/sw.js
